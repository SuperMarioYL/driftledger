<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="DriftLedger architecture: plan.md + trace.jsonl → Reconciler → Deviation ledger + bubbletea TUI">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static base connectors with arrowheads -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="220" y1="85"  x2="350" y2="180" marker-end="url(#ah-l)"/>
    <line x1="220" y1="275" x2="350" y2="180" marker-end="url(#ah-l)"/>
    <line x1="530" y1="180" x2="660" y2="85"  marker-end="url(#ah-l)"/>
    <line x1="530" y1="180" x2="660" y2="275" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (seamless: dasharray 6 10 = period 16, from 32→0 = 2 periods) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="220" y1="85"  x2="350" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="275" x2="350" y2="180" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-0.45s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="180" x2="660" y2="85"  stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="180" x2="660" y2="275" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-1.35s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packets flowing along each connector -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M220,85 L350,180" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M220,275 L350,180" dur="2.6s" begin="-0.65s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="-0.65s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M530,180 L660,85" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M530,180 L660,275" dur="2.6s" begin="-1.95s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="-1.95s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: breathing fill-opacity 0.10↔0.18, staggered negative begins -->
  <g>
    <!-- plan.md (input contract, blue) -->
    <rect x="40" y="50" width="180" height="70" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">plan.md</text>
    <text x="130" y="98" text-anchor="middle" font-size="11" fill="#6E6E73">versioned contract</text>

    <!-- trace.jsonl (input stream, teal) -->
    <rect x="40" y="240" width="180" height="70" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">trace.jsonl</text>
    <text x="130" y="288" text-anchor="middle" font-size="11" fill="#6E6E73">live execution stream</text>

    <!-- Reconciler (core, purple) -->
    <rect x="350" y="145" width="180" height="70" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Reconciler</text>
    <text x="440" y="193" text-anchor="middle" font-size="11" fill="#6E6E73">structural diff</text>

    <!-- Deviation ledger (output record, blue) -->
    <rect x="660" y="50" width="180" height="70" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.0s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Deviation ledger</text>
    <text x="750" y="98" text-anchor="middle" font-size="11" fill="#6E6E73">append-only JSONL</text>

    <!-- bubbletea TUI (output control, green) -->
    <rect x="660" y="240" width="180" height="70" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">bubbletea TUI</text>
    <text x="750" y="288" text-anchor="middle" font-size="11" fill="#6E6E73">accept / patch</text>
  </g>
</svg>
