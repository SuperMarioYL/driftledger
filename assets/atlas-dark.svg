<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="DriftLedger architecture: plan.md + trace.jsonl → Reconciler → Deviation ledger + bubbletea TUI">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="220" y1="85"  x2="350" y2="180" marker-end="url(#ah-d)"/>
    <line x1="220" y1="275" x2="350" y2="180" marker-end="url(#ah-d)"/>
    <line x1="530" y1="180" x2="660" y2="85"  marker-end="url(#ah-d)"/>
    <line x1="530" y1="180" x2="660" y2="275" marker-end="url(#ah-d)"/>
  </g>

  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="220" y1="85"  x2="350" y2="180" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" repeatCount="indefinite"/>
    </line>
    <line x1="220" y1="275" x2="350" y2="180" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-0.45s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="180" x2="660" y2="85"  stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="530" y1="180" x2="660" y2="275" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.8s" begin="-1.35s" repeatCount="indefinite"/>
    </line>
  </g>

  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M220,85 L350,180" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M220,275 L350,180" dur="2.6s" begin="-0.65s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="-0.65s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M530,180 L660,85" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="-1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M530,180 L660,275" dur="2.6s" begin="-1.95s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="-1.95s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="40" y="50" width="180" height="70" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">plan.md</text>
    <text x="130" y="98" text-anchor="middle" font-size="11" fill="#A1A1A8">versioned contract</text>

    <rect x="40" y="240" width="180" height="70" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="130" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">trace.jsonl</text>
    <text x="130" y="288" text-anchor="middle" font-size="11" fill="#A1A1A8">live execution stream</text>

    <rect x="350" y="145" width="180" height="70" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="175" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">Reconciler</text>
    <text x="440" y="193" text-anchor="middle" font-size="11" fill="#A1A1A8">structural diff</text>

    <rect x="660" y="50" width="180" height="70" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.0s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">Deviation ledger</text>
    <text x="750" y="98" text-anchor="middle" font-size="11" fill="#A1A1A8">append-only JSONL</text>

    <rect x="660" y="240" width="180" height="70" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">bubbletea TUI</text>
    <text x="750" y="288" text-anchor="middle" font-size="11" fill="#A1A1A8">accept / patch</text>
  </g>
</svg>
